<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>分析结果</title>
  <link rel="stylesheet" href="../../../node_modules/katex/dist/katex.min.css" />
  <style>
    :root {
      --bg: #15171f;
      --bg2: #171a22;
      --panel: #1d2029;
      --panel2: #262a36;
      --pre-bg: #101218;
      --th-bg: #232734;
      --border: rgba(120, 130, 160, 0.25);
      --text: #dbe2f0;
      --muted: #8b93a7;
      --accent: #60a5fa;
      --accent-bg: rgba(96, 165, 250, 0.14);
      --hover: rgba(255, 255, 255, 0.10);
      --scroll-thumb: #333949;
      --scroll-thumb-hover: #454d63;
      --code-color: #93c5fd;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6fa;
        --bg2: #eef0f5;
        --panel: #ffffff;
        --panel2: #eef0f5;
        --pre-bg: #f2f3f8;
        --th-bg: #e4e7ee;
        --border: rgba(60, 70, 100, 0.18);
        --text: #1f2430;
        --muted: #6b7280;
        --accent: #2f6fe0;
        --accent-bg: rgba(47, 111, 224, 0.10);
        --hover: rgba(0, 0, 0, 0.06);
        --scroll-thumb: #c3c8d4;
        --scroll-thumb-hover: #a9b0bf;
        --code-color: #2f6fe0;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    /* Vue 挂载后由 #app-shell 接管 body 的纵向 flex 布局 */
    #app-shell { display: flex; flex-direction: column; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.65 "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* 全局滚动条 */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb); border-radius: 6px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-hover); }
    ::-webkit-scrollbar-corner { background: transparent; }
    header {
      padding: 10px 8px 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--panel);
      -webkit-app-region: drag;
    }
    header .no-drag { -webkit-app-region: no-drag; }
    .win-ops { display: flex; margin-left: 6px; }
    .win-ops button {
      width: 36px; height: 30px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--muted);
      border-radius: 6px; font-size: 13px;
    }
    .win-ops button:hover { background: var(--hover); color: var(--text); }
    .win-ops button.close:hover { background: #e81123; color: #fff; }
    .agent-chip {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--accent-bg);
      border: 1px solid rgba(96, 165, 250, 0.4);
      border-radius: 8px; padding: 5px 10px; font-weight: 600;
    }
    .meta { color: var(--muted); font-size: 12px; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .status.running .dot { background: #34d399; animation: pulse 1s infinite alternate; }
    .status.error .dot { background: #f87171; }
    @keyframes pulse { from { opacity: .4 } to { opacity: 1 } }
    .spacer { flex: 1; }
    select, button, textarea, input {
      font: inherit; color: var(--text);
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 10px; outline: none;
    }
    select:focus, textarea:focus { border-color: var(--accent); }
    button { cursor: pointer; transition: all .12s; }
    button:hover { border-color: var(--accent); background: var(--accent-bg); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    #previewWrap {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      cursor: pointer;
    }
    #preview {
      display: block;
      max-width: 100%;
      max-height: 160px;
      margin: 0 auto;
      border-radius: 6px;
      border: 1px solid var(--border);
      object-fit: contain;
    }
    #previewWrap .pv-tip { text-align: center; color: var(--muted); font-size: 11px; margin-top: 6px; }
    body.preview-full #preview { max-height: none; width: 100%; }
    body.preview-full { overflow: auto; }

    #content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
    }
    #reasoning {
      margin-bottom: 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 12.5px;
      display: none;
    }
    #reasoning summary { cursor: pointer; user-select: none; color: #a5b4d4; }
    #reasoning pre { white-space: pre-wrap; margin-top: 8px; font-family: inherit; }
    #streamTip { color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(96, 165, 250, .25); border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg) } }
    #answer { display: none; }
    #answer.md { display: block; }
    .error-box {
      display: none;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #e5484d;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }
    .error-box button { margin-top: 8px; }

    /* Markdown 样式 */
    .md h1, .md h2, .md h3, .md h4 { margin: 14px 0 8px; line-height: 1.4; }
    .md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; }
    .md p { margin: 8px 0; }
    .md ul, .md ol { margin: 8px 0 8px 22px; }
    .md li { margin: 3px 0; }
    .md code {
      background: var(--panel2); border-radius: 4px; padding: 1.5px 6px;
      font: 12.5px/1.5 Consolas, "Courier New", monospace; color: var(--code-color);
    }
    .md pre {
      background: var(--pre-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; overflow-x: auto; margin: 10px 0;
    }
    .md pre code { background: none; padding: 0; color: var(--text); font-size: 12.5px; line-height: 1.6; }
    .md table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; max-width: 100%; }
    .md th, .md td { border: 1px solid var(--border); padding: 6px 12px; }
    .md th { background: var(--th-bg); }
    .md blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); margin: 10px 0; }
    .md a { color: var(--accent); }
    .md img { max-width: 100%; border-radius: 6px; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .md .katex { font-size: 1.02em; }
    .md .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }

    footer {
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #followup { display: flex; gap: 8px; }
    #followup textarea {
      flex: 1; resize: none; min-height: 42px; max-height: 120px;
      font-family: inherit;
    }
    #actionsRow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .copied-flash { border-color: #22c55e !important; color: #bbf7d0 !important; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="tpl-result">
    <div id="app-shell">
      <header>
        <span class="agent-chip" id="agentChip">{{ agentIcon }} {{ agentName }}</span>
        <span class="meta" id="modelMeta">{{ modelMeta }}</span>
        <span class="spacer"></span>
        <span class="status no-drag" id="status" :class="statusClass"><span class="dot"></span><span id="statusText">{{ statusText }}</span></span>
        <div class="win-ops no-drag">
          <button id="winMin" :title="$t('win.minimize')" @click="winOp('minimize')">—</button>
          <button id="winMax" :title="$t('win.maximize')" @click="winOp('maximize')">▢</button>
          <button id="winClose" class="close" :title="$t('win.close')" @click="winOp('close')">✕</button>
        </div>
      </header>

      <div id="previewWrap" :title="$t('res.previewTip')" @click="togglePreview">
        <img id="preview" :src="previewSrc" alt="" />
        <div class="pv-tip">{{ $t('res.previewTip') }}</div>
      </div>

      <div id="content" ref="content">
        <details id="reasoning" :style="{ display: reasoning ? 'block' : 'none' }">
          <summary>{{ $t('res.thinking') }}</summary>
          <pre id="reasoningText">{{ reasoning }}</pre>
        </details>
        <div class="error-box" id="errorBox" v-show="error.visible">
          <div>{{ error.message }}</div>
          <button @click="act({ type: 'reanalyze' })">{{ $t('res.retry') }}</button>
        </div>
        <div id="streamTip" v-show="streamTip"><span class="spinner"></span><span>{{ $t('res.streamingTip') }}</span></div>
        <div id="answer" class="md" v-show="answerVisible" v-html="answerHtml"></div>
      </div>

      <footer>
        <div id="followup">
          <textarea id="followupInput" v-model="followupText" :placeholder="$t('res.placeholder')" @keydown.enter.exact.prevent="sendFollowup"></textarea>
          <button id="btnSend" :title="$t('res.send')" :disabled="streaming" @click="sendFollowup">{{ $t('res.send') }}</button>
        </div>
        <div id="actionsRow">
          <select id="agentSelect" v-model="agentId" :title="$t('res.switchAgent')" @change="onAgentChange">
            <option v-for="a in agents" :key="a.id" :value="a.id">{{ a.icon || '🤖' }} {{ a.name }}</option>
          </select>
          <button id="btnReanalyze" :disabled="streaming" @click="act({ type: 'reanalyze' })">{{ $t('res.reanalyze') }}</button>
          <button id="btnStop" v-show="streaming" @click="act({ type: 'stop' })">{{ $t('res.stop') }}</button>
          <button id="btnCopyResult" @click="copyResult">{{ copyResultLabel }}</button>
          <button id="btnSaveImage" @click="act({ type: 'save-image' })">{{ $t('res.saveImage') }}</button>
          <button id="btnCopyImage" @click="copyImage">{{ copyImageLabel }}</button>
        </div>
      </footer>
    </div>
  </script>

  <script src="../../../node_modules/marked/marked.min.js"></script>
  <script src="../../../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="../../../node_modules/katex/dist/katex.min.js"></script>
  <script src="../../../node_modules/katex/dist/contrib/auto-render.min.js"></script>
  <script src="../../../node_modules/vue/dist/vue.min.js"></script>
  <script src="../shared/vue-i18n.js"></script>
  <script src="result-app.js"></script>
  <script src="result.js"></script>
</body>
</html>
