<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>录制</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { background: transparent; overflow: hidden; }
    body { font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif; }
    #live {
      display: flex; flex-direction: row; align-items: center; gap: 10px;
      width: 100vw; height: 100vh;
      padding: 12px 14px; border-radius: 10px;
      background: rgba(21, 23, 31, 0.97); color: #dbe2f0;
      border: 1px solid rgba(120, 130, 160, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      cursor: move;
    }
    button {
      border: none; border-radius: 7px; padding: 7px 12px; cursor: pointer;
      font: 13px/1 inherit; color: #dbe2f0; background: rgba(99, 130, 255, 0.22);
    }
    button:hover { background: rgba(99, 130, 255, 0.35); }
    button.cancel:hover { background: rgba(248, 113, 113, 0.28); color: #fca5a5; }
    button:disabled { opacity: .5; cursor: default; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }
    #time { font: 13px Consolas, monospace; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="tpl-recbar">
    <div id="live" @mousedown="onDragDown">
      <span class="dot"></span>
      <span id="time">{{ timeText }}</span>
      <button :disabled="stopped" @click.stop="stop">{{ $t('rec.stop') }}</button>
      <button class="cancel" @click.stop="cancel">{{ $t('rec.cancel') }}</button>
    </div>
  </script>

  <script src="../../../node_modules/vue/dist/vue.min.js"></script>
  <script src="../shared/vue-i18n.js"></script>
  <script src="recbar-app.js"></script>
  <script src="recbar.js"></script>
</body>
</html>
