<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>录制</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { background: transparent; overflow: hidden; }
    body { font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif; }
    #live {
      display: flex; flex-direction: row; align-items: center; gap: 10px;
      width: 100%; height: 100%;
      padding: 12px 14px; border-radius: 10px;
      background: rgba(21, 23, 31, 0.97); color: #dbe2f0;
      border: 1px solid rgba(120, 130, 160, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      cursor: move;
    }
    button {
      border: none; border-radius: 7px; padding: 7px 12px; cursor: pointer;
      font: 13px/1 inherit; color: #dbe2f0; background: rgba(99, 130, 255, 0.22);
    }
    button:hover { background: rgba(99, 130, 255, 0.35); }
    button.cancel:hover { background: rgba(248, 113, 113, 0.28); color: #fca5a5; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }
    #time { font: 13px Consolas, monospace; }
    #status { color: #8b93a7; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <div id="live">
    <span class="dot"></span>
    <span id="time">00:00</span>
    <button id="btnStop">停止</button>
    <button class="cancel" id="btnCancel">取消</button>
    <span id="status"></span>
  </div>
  <script src="recbar.js"></script>
</body>
</html>
