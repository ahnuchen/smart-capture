<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>截图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: crosshair; }
    #bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      -webkit-user-drag: none;
    }
    #dim {
      position: absolute; inset: 0;
      background: rgba(8, 10, 18, 0.22);
    }
    /* 选区：box-shadow 制造选区外轻微变暗、选区内清晰 */
    #sel {
      position: absolute;
      display: none;
      border: 1px solid rgba(96, 165, 250, 0.95);
      box-shadow: 0 0 0 100000px rgba(8, 10, 18, 0.22);
      background-repeat: no-repeat;
      pointer-events: none;
    }
    #sel.confirm { border: 1.5px solid #3b82f6; pointer-events: none; }
    /* 标注画布容器（Fabric 生成），定位到选区 */
    #annWrap { position: absolute; display: none; z-index: 4; }
    /* Vue 只管外围 UI；不设 z-index/transform，避免形成层叠上下文盖住画布 */
    #overlay-ui { position: absolute; inset: 0; pointer-events: none; }
    /* 选区调整：8 个缩放手柄 + 4 条边移动带。
       视觉点很小（7px）但热区用 ::after 撑到 24px，避免「看得见点不着」。 */
    #adj { position: absolute; inset: 0; display: none; z-index: 7; pointer-events: none; }
    #adj .handle {
      position: absolute; width: 7px; height: 7px; margin: -4px 0 0 -4px;
      background: #fff; border: 1px solid #3b82f6; border-radius: 2px;
      pointer-events: auto; box-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    #adj .handle::after {
      content: ''; position: absolute; left: -9px; top: -9px; right: -9px; bottom: -9px;
    }
    #adj .handle[data-cur=nw], #adj .handle[data-cur=se] { cursor: nwse-resize; }
    #adj .handle[data-cur=ne], #adj .handle[data-cur=sw] { cursor: nesw-resize; }
    #adj .handle[data-cur=n], #adj .handle[data-cur=s] { cursor: ns-resize; }
    #adj .handle[data-cur=e], #adj .handle[data-cur=w] { cursor: ew-resize; }
    #adj .band { position: absolute; pointer-events: auto; }
    #adj .band[data-cur=move] { cursor: move; }
    #size {
      position: absolute;
      display: none;
      background: rgba(20, 22, 32, 0.85);
      color: #dbeafe;
      font: 12px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(96, 165, 250, 0.4);
      white-space: nowrap;
    }
    #tip {
      position: absolute;
      display: none;
      background: rgba(20, 22, 32, 0.85);
      color: #cbd5e1;
      font: 12px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      white-space: nowrap;
    }
    #tip b { color: #93c5fd; font-weight: 600; }
    body.selecting #dim { display: none; }
    /* 指针移到工具条上时本窗交出光标，避免十字线与工具条光标互相抢占导致闪烁 */
    body.over-toolbar, body.over-toolbar * { cursor: default !important; }

    /* 十字辅助线 */
    #crossV, #crossH { position: absolute; display: none; pointer-events: none; background: rgba(255, 255, 255, 0.35); z-index: 5; }
    #crossV { top: 0; bottom: 0; width: 1px; }
    #crossH { left: 0; right: 0; height: 1px; }

    /* 录屏设置面板（居中于选区）与倒计时 */
    #recPanel {
      position: absolute; display: none; z-index: 20;
      flex-direction: column; gap: 10px; padding: 12px 14px;
      border-radius: 10px; background: rgba(21, 23, 31, 0.97);
      color: #dbe2f0; border: 1px solid rgba(120, 130, 160, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); pointer-events: auto;
      font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #recPanel.show { display: flex; }
    #recPanel .row { display: flex; align-items: center; gap: 8px; }
    #recPanel .title { color: #8b93a7; font-size: 12px; }
    #recPanel label.opt { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    #recPanel button {
      border: none; border-radius: 7px; padding: 7px 12px; cursor: pointer;
      font: 13px/1 inherit; color: #dbe2f0; background: rgba(99, 130, 255, 0.22);
    }
    #recPanel button.primary { background: #2f6fe0; color: #fff; }
    #recPanel .actions { justify-content: flex-end; }
    #recCount {
      position: absolute; display: none; z-index: 21;
      align-items: center; justify-content: center;
      width: 96px; height: 96px; border-radius: 50%;
      background: rgba(21, 23, 31, 0.92); border: 1px solid rgba(96, 165, 250, 0.7);
      color: #fff; font: 700 40px/1 "Segoe UI", sans-serif;
    }
    #recCount.show { display: flex; }
    /* 取色器 */
    #picker {
      position: absolute;
      display: none;
      z-index: 6;
      pointer-events: none;
      background: rgba(21, 23, 31, 0.94);
      border: 1px solid rgba(120, 130, 160, 0.45);
      border-radius: 10px;
      padding: 7px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
      color: #dbe2f0;
      font: 12px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #pickMag { display: block; border-radius: 5px; image-rendering: pixelated; }
    #pickRow { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
    #pickSwatch { width: 15px; height: 15px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.45); flex: none; }
    #pickText { font: 12px Consolas, "Courier New", monospace; }
    #pickPos { color: #8b93a7; margin-top: 3px; font-size: 11px; }
    #pickFmt { color: #64748b; margin-top: 1px; font-size: 10.5px; }
  </style>
</head>
<body>
  <img id="bg" draggable="false" />
  <div id="dim"></div>
  <div id="sel"></div>
  <!-- Fabric 拥有这个子树，必须留在 Vue 根之外 -->
  <div id="annWrap"><canvas id="ann"></canvas></div>

  <div id="app"></div>

  <script type="text/x-template" id="tpl-overlay">
    <div id="overlay-ui">
      <div id="size" :style="sizeStyle">{{ size.text }}</div>
      <div id="tip" :style="tipStyle" v-html="$t('overlay.tip')"></div>
      <div id="crossV" :style="crossVStyle"></div>
      <div id="crossH" :style="crossHStyle"></div>
      <div id="adj" :style="{ display: adjVisible ? 'block' : 'none' }">
        <div
          v-for="b in bands" :key="'band-' + b.side"
          class="band" :class="b.side" data-cur="move"
          :style="{ left: b.left + 'px', top: b.top + 'px', width: b.width + 'px', height: b.height + 'px' }"
          @mousedown.prevent="adjustStart('move', $event)"
        ></div>
        <div
          v-for="h in handles" :key="'handle-' + h.cur"
          class="handle" :data-cur="h.cur"
          :style="{ left: h.x + 'px', top: h.y + 'px' }"
          @mousedown.prevent="adjustStart(h.cur, $event)"
        ></div>
      </div>
      <div id="recPanel">
        <div class="row"><span class="title">{{ $t('rec.format') }}</span>
          <label class="opt"><input type="radio" name="recfmt" value="mp4" checked /> MP4</label>
          <label class="opt"><input type="radio" name="recfmt" value="gif" /> GIF</label>
        </div>
        <div class="row actions">
          <button id="recCancel">{{ $t('rec.cancel') }}</button>
          <button id="recStart" class="primary">{{ $t('rec.start') }}</button>
        </div>
      </div>
      <div id="recCount">3</div>
      <div id="picker" :style="pickerStyle">
        <canvas id="pickMag"></canvas>
        <div id="pickRow"><span id="pickSwatch" :style="{ background: picker.color }"></span><span id="pickText">{{ picker.text }}</span></div>
        <div id="pickPos">{{ picker.pos }}</div>
        <div id="pickFmt">{{ $t('overlay.pickFmt') }}</div>
      </div>
    </div>
  </script>

  <script src="../../../node_modules/fabric/dist/fabric.min.js"></script>
  <script src="../../../node_modules/vue/dist/vue.min.js"></script>
  <script src="../shared/vue-i18n.js"></script>
  <script src="fabric-controller.js"></script>
  <script src="overlay-app.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
