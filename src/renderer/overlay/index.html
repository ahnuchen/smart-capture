<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>截图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: crosshair; }
    #bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      -webkit-user-drag: none;
    }
    #dim {
      position: absolute; inset: 0;
      background: rgba(8, 10, 18, 0.22);
    }
    /* 选区：box-shadow 制造选区外轻微变暗、选区内清晰 */
    #sel {
      position: absolute;
      display: none;
      border: 1px solid rgba(96, 165, 250, 0.95);
      box-shadow: 0 0 0 100000px rgba(8, 10, 18, 0.22);
      background-repeat: no-repeat;
      pointer-events: none;
    }
    #sel.confirm { border: 1.5px solid #3b82f6; pointer-events: none; }
    /* 标注画布容器（Fabric 生成），定位到选区 */
    #annWrap { position: absolute; display: none; z-index: 4; }
    /* 选区调整：8 个缩放手柄 + 4 条边移动带 */
    #adj { position: absolute; inset: 0; display: none; z-index: 7; pointer-events: none; }
    #adj .handle {
      position: absolute; width: 9px; height: 9px; margin: -5px 0 0 -5px;
      background: #fff; border: 1.5px solid #3b82f6; border-radius: 2px;
      pointer-events: auto; box-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    #adj .handle[data-cur=nw], #adj .handle[data-cur=se] { cursor: nwse-resize; }
    #adj .handle[data-cur=ne], #adj .handle[data-cur=sw] { cursor: nesw-resize; }
    #adj .handle[data-cur=n], #adj .handle[data-cur=s] { cursor: ns-resize; }
    #adj .handle[data-cur=e], #adj .handle[data-cur=w] { cursor: ew-resize; }
    #adj .band { position: absolute; pointer-events: auto; }
    #adj .band[data-cur=move] { cursor: move; }
    #adj .band.n, #adj .band.s { height: 7px; left: 9px; right: 9px; }
    #adj .band.w, #adj .band.e { width: 7px; top: 9px; bottom: 9px; }
    #adj .band.n { cursor: move; } #adj .band.s { cursor: move; }
    #adj .band.w { cursor: move; } #adj .band.e { cursor: move; }
    #size {
      position: absolute;
      display: none;
      background: rgba(20, 22, 32, 0.85);
      color: #dbeafe;
      font: 12px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(96, 165, 250, 0.4);
      white-space: nowrap;
    }
    #tip {
      position: absolute;
      display: none;
      background: rgba(20, 22, 32, 0.85);
      color: #cbd5e1;
      font: 12px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      white-space: nowrap;
    }
    #tip b { color: #93c5fd; font-weight: 600; }
    body.selecting #dim { display: none; }

    /* 十字辅助线 */
    #crossV, #crossH { position: absolute; display: none; pointer-events: none; background: rgba(255, 255, 255, 0.35); z-index: 5; }
    #crossV { top: 0; bottom: 0; width: 1px; }
    #crossH { left: 0; right: 0; height: 1px; }

    /* 取色器 */
    #picker {
      position: absolute;
      display: none;
      z-index: 6;
      pointer-events: none;
      background: rgba(21, 23, 31, 0.94);
      border: 1px solid rgba(120, 130, 160, 0.45);
      border-radius: 10px;
      padding: 7px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
      color: #dbe2f0;
      font: 12px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #pickMag { display: block; border-radius: 5px; image-rendering: pixelated; }
    #pickRow { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
    #pickSwatch { width: 15px; height: 15px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.45); flex: none; }
    #pickText { font: 12px Consolas, "Courier New", monospace; }
    #pickPos { color: #8b93a7; margin-top: 3px; font-size: 11px; }
    #pickFmt { color: #64748b; margin-top: 1px; font-size: 10.5px; }
  </style>
</head>
<body>
  <img id="bg" draggable="false" />
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="annWrap"><canvas id="ann"></canvas></div>
  <div id="adj"></div>
  <div id="size"></div>
  <div id="tip"><b>Enter / 双击 / ✔完成</b> 复制并完成 · <b>ESC</b> 重新选区</div>
  <div id="crossV"></div>
  <div id="crossH"></div>
  <div id="picker">
    <canvas id="pickMag"></canvas>
    <div id="pickRow"><span id="pickSwatch"></span><span id="pickText"></span></div>
    <div id="pickPos"></div>
    <div id="pickFmt">Shift 切换 HEX / RGB / HSL</div>
  </div>
  <script src="../../../node_modules/fabric/dist/fabric.min.js"></script>
  <script src="../../shared/i18n-dom.js"></script>
  <script>applyI18n();</script>
  <script src="overlay.js"></script>
</body>
</html>
