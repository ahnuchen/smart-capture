<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>录制区域</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
    /* 与选区确认后的边框同一套样式（1.5px #3b82f6）；窗口比选区大 2px，
       所以边框整个落在选区外侧，既不会录进成片，视觉上也和选区边框重合 */
    #frame {
      width: 100%; height: 100%;
      border: 2px solid #3b82f6;
    }
  </style>
</head>
<body>
  <div id="frame"></div>
</body>
</html>
