<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>录制区域</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
    /* 窗口比选区大一圈，边框画在选区外侧，不会被录进成片 */
    #frame {
      width: 100%; height: 100%;
      border: 3px solid rgba(59, 130, 246, 0.95);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="frame"></div>
</body>
</html>
