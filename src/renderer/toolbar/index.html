<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>工具条</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { background: transparent; overflow: visible; }
    body { font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif; }
    #bar {
      position: relative;
      display: inline-block;
      padding: 7px 8px;
      border-radius: 10px;
      background: rgba(21, 23, 31, 0.96);
      border: 1px solid rgba(120, 130, 160, 0.35);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .row { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      background: transparent;
      color: #dbe2f0;
      font: 13px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 6px 8px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s;
    }
    button:hover { background: rgba(99, 130, 255, 0.22); }
    button:active { background: rgba(99, 130, 255, 0.35); }
    button .ico { font-size: 15px; line-height: 1; display: inline-flex; }
    button .ico svg { width: 15px; height: 15px; fill: currentColor; }
    button.tool { padding: 6px 7px; min-width: 29px; justify-content: center; }
    button.tool.active { background: rgba(99, 130, 255, 0.40); box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.8); }
    #btnColor .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,.55); }
    #btnWidth .dot { display: inline-block; background: #dbe2f0; border-radius: 50%; }
    button.agent { background: rgba(70, 90, 160, 0.18); }
    button.agent:hover { background: rgba(99, 130, 255, 0.32); }
    button.agent.default { box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.65); }
    button.primary { background: #2f6fe0; color: #fff; }
    button.primary:hover { background: #3b82f6; }
    button.exit:hover { background: rgba(248, 113, 113, 0.25); color: #fca5a5; }
    .sep { width: 1px; height: 20px; background: rgba(120, 130, 160, 0.35); margin: 0 4px; flex: none; }
    .hint { color: #8b93a7; font-size: 11px; padding: 2px 6px 0; }
    /* 颜色/线宽弹层：绝对定位浮在条上方，不参与 #bar 尺寸，工具栏高度保持不变 */
    #flyout {
      position: absolute;
      left: 8px;
      bottom: calc(100% + 7px);
      display: none;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      border-radius: 9px;
      background: rgba(21, 23, 31, 0.97);
      border: 1px solid rgba(120, 130, 160, 0.4);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      z-index: 5;
    }
    #flyout.show { display: flex; }
    .swatch { width: 19px; height: 19px; border-radius: 5px; border: 2px solid transparent; cursor: pointer; flex: none; }
    .swatch.active { border-color: #fff; }
    .wdot { background: #dbe2f0; border-radius: 50%; cursor: pointer; flex: none; }
    .wdot.active { box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.9); }
  </style>
</head>
<body>
  <div id="bar">
    <div id="flyout"></div>
    <div class="row" id="rowMain"></div>
    <div class="row" id="rowAgents"></div>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
