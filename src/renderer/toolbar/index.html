<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>工具条</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { background: transparent; overflow: hidden; }
    body { font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif; }
    #bar {
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(21, 23, 31, 0.96);
      border: 1px solid rgba(120, 130, 160, 0.35);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      color: #dbe2f0;
      font: 13px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 6px 9px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s;
    }
    button:hover { background: rgba(99, 130, 255, 0.22); }
    button:active { background: rgba(99, 130, 255, 0.35); }
    button .ico { font-size: 15px; line-height: 1; }
    /* 标注工具：图标方块 */
    button.tool { padding: 6px; min-width: 30px; justify-content: center; }
    button.tool.active { background: rgba(99, 130, 255, 0.40); outline: 1px solid rgba(96, 165, 250, 0.7); }
    button.control.active { background: rgba(99, 130, 255, 0.28); }
    button.agent { background: rgba(70, 90, 160, 0.18); }
    button.agent:hover { background: rgba(99, 130, 255, 0.32); }
    button.agent.default { outline: 1px solid rgba(96, 165, 250, 0.65); }
    button.plain:hover { background: rgba(255, 255, 255, 0.10); }
    button.primary { background: #2f6fe0; color: #fff; }
    button.primary:hover { background: #3b82f6; }
    button.exit:hover { background: rgba(248, 113, 113, 0.25); color: #fca5a5; }
    .sep { width: 1px; height: 20px; background: rgba(120, 130, 160, 0.35); margin: 0 3px; }
    .hint { color: #8b93a7; font-size: 11px; padding: 2px 6px 0; }
    /* 颜色 / 线宽弹板 */
    #panel {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(32, 36, 48, 0.95);
      border: 1px solid rgba(120, 130, 160, 0.3);
    }
    #panel.show { display: flex; }
    .swatch {
      width: 20px; height: 20px; border-radius: 5px;
      border: 2px solid transparent; cursor: pointer; flex: none;
    }
    .swatch.active { border-color: #fff; }
    .widths { display: flex; align-items: center; gap: 8px; padding-left: 4px; }
    .wdot {
      background: #dbe2f0; border-radius: 50%; cursor: pointer; flex: none;
    }
    .wdot.active { box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.9); }
  </style>
</head>
<body>
  <div id="bar">
    <div class="row" id="rowTools"></div>
    <div class="row" id="rowControls"></div>
    <div class="row" id="panel"></div>
    <div class="row" id="rowOutput"></div>
    <div class="row" id="rowAgents"></div>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
