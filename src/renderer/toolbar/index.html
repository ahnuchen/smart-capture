<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>工具条</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { background: transparent; overflow: hidden; }
    body { font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif; }
    #bar {
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(21, 23, 31, 0.96);
      border: 1px solid rgba(120, 130, 160, 0.35);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      
    }
    .row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      color: #dbe2f0;
      font: 13px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s;
    }
    button:hover { background: rgba(99, 130, 255, 0.22); }
    button:active { background: rgba(99, 130, 255, 0.35); }
    button .ico { font-size: 15px; }
    button.agent { background: rgba(70, 90, 160, 0.18); }
    button.agent:hover { background: rgba(99, 130, 255, 0.32); }
    button.agent.default { outline: 1px solid rgba(96, 165, 250, 0.65); }
    button.agent .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: #60a5fa; display: inline-block;
    }
    button.plain:hover { background: rgba(255, 255, 255, 0.10); }
    button.primary { background: #2f6fe0; border-color: #3b82f6; color: #fff; }
    button.primary:hover { background: #3b82f6; }
    button.exit:hover { background: rgba(248, 113, 113, 0.25); color: #fca5a5; }
    .sep { width: 1px; height: 20px; background: rgba(120, 130, 160, 0.35); margin: 0 3px; }
    .hint { color: #8b93a7; font-size: 11px; padding: 2px 6px 0; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="row" id="rowActions"></div>
    <div class="row" id="rowAgents"></div>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
