<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>工具条</title>
  <style>
    /* 主题跟随 nativeTheme.themeSource（设置里的「深色/浅色」），与设置页同一机制 */
    :root {
      --tb-bg: rgba(21, 23, 31, 0.96);
      --tb-border: rgba(120, 130, 160, 0.35);
      --tb-text: #dbe2f0;
      --tb-muted: #8b93a7;
      --tb-hover: rgba(99, 130, 255, 0.22);
      --tb-active: rgba(99, 130, 255, 0.40);
      --tb-active-ring: rgba(96, 165, 250, 0.8);
      --tb-agent-bg: rgba(70, 90, 160, 0.18);
      --tb-agent-hover: rgba(99, 130, 255, 0.32);
      --tb-primary: #2f6fe0;
      --tb-primary-hover: #3b82f6;
      --tb-primary-text: #ffffff;
      --tb-exit-hover: rgba(248, 113, 113, 0.25);
      --tb-exit-text: #fca5a5;
      --tb-sep: rgba(120, 130, 160, 0.35);
      --tb-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      --tb-swatch-ring: rgba(255, 255, 255, 0.55);
      --tb-dot: #dbe2f0;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --tb-bg: rgba(255, 255, 255, 0.97);
        --tb-border: rgba(60, 70, 100, 0.2);
        --tb-text: #1f2430;
        --tb-muted: #6b7280;
        --tb-hover: rgba(59, 130, 246, 0.14);
        --tb-active: rgba(59, 130, 246, 0.24);
        --tb-active-ring: rgba(37, 99, 235, 0.65);
        --tb-agent-bg: rgba(59, 130, 246, 0.1);
        --tb-agent-hover: rgba(59, 130, 246, 0.2);
        --tb-primary: #2563eb;
        --tb-primary-hover: #3b82f6;
        --tb-primary-text: #ffffff;
        --tb-exit-hover: rgba(239, 68, 68, 0.16);
        --tb-exit-text: #dc2626;
        --tb-sep: rgba(60, 70, 100, 0.2);
        --tb-shadow: 0 8px 24px rgba(31, 41, 55, 0.22);
        --tb-swatch-ring: rgba(0, 0, 0, 0.25);
        --tb-dot: #1f2430;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { background: transparent; overflow: visible; }
    body { font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif; }
    #bar {
      position: relative;
      display: inline-block;
      padding: 7px 8px 7px 24px;
      border-radius: 10px;
      background: var(--tb-bg);
      border: 1px solid var(--tb-border);
      box-shadow: var(--tb-shadow);
    }
    /* 左侧拖拽手柄：整条高度，悬浮变移动光标 */
    #grip {
      position: absolute; left: 4px; top: 6px; bottom: 6px; width: 14px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; color: var(--tb-muted); cursor: move; flex: none;
    }
    #grip:hover { background: var(--tb-hover); color: var(--tb-text); }
    #grip:active { background: var(--tb-active); }
    #grip svg { width: 10px; height: 16px; fill: currentColor; display: block; }
    .row { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      background: transparent;
      color: var(--tb-text);
      font: 13px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 6px 8px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s;
    }
    button:hover { background: var(--tb-hover); }
    button:active { background: var(--tb-active); }
    button .ico { font-size: 15px; line-height: 1; display: inline-flex; }
    button .ico svg { width: 15px; height: 15px; fill: currentColor; }
    button.tool { padding: 6px 7px; min-width: 29px; justify-content: center; }
    button.tool.active { background: var(--tb-active); box-shadow: inset 0 0 0 1px var(--tb-active-ring); }
    #btnColor .sw, button .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--tb-swatch-ring); }
    button .dot { display: inline-block; background: var(--tb-dot); border-radius: 50%; }
    button.agent { background: var(--tb-agent-bg); }
    button.agent:hover { background: var(--tb-agent-hover); }
    button.agent.default { box-shadow: inset 0 0 0 1px var(--tb-active-ring); }
    button.primary { background: var(--tb-primary); color: var(--tb-primary-text); }
    button.primary:hover { background: var(--tb-primary-hover); }
    button.exit:hover { background: var(--tb-exit-hover); color: var(--tb-exit-text); }
    .sep { width: 1px; height: 20px; background: var(--tb-sep); margin: 0 4px; flex: none; }
    .hint { color: var(--tb-muted); font-size: 11px; padding: 2px 6px 0; }
    /* 样式行常驻、条目数固定：窗口尺寸恒定，工具栏不会因选工具/改样式而挪位 */
    #styleRow { display: flex; align-items: center; gap: 9px; margin-top: 6px; min-height: 23px; }
    .swatch { width: 19px; height: 19px; border-radius: 5px; border: 1px solid var(--tb-border); cursor: pointer; flex: none; }
    .swatch.active { border: 2px solid var(--tb-active-ring); }
    .wdot { background: var(--tb-dot); border-radius: 50%; cursor: pointer; flex: none; }
    .wdot.active { box-shadow: 0 0 0 2px var(--tb-active-ring); }
    .pgroup { display: flex; align-items: center; gap: 7px; }
    #styleRow .sep { margin: 0 2px; }
    #styleRow .hint { font-size: 11px; color: var(--tb-muted); }
    /* 字号下拉：贴合工具条配色，高度与线宽行一致 */
    #styleRow .size-select {
      height: 23px; padding: 0 6px; border-radius: 6px; cursor: pointer;
      background: var(--tb-bg); color: var(--tb-text);
      border: 1px solid var(--tb-border); font-size: 12px; font-family: inherit;
      outline: none;
    }
    #styleRow .size-select option { background: var(--tb-bg); color: var(--tb-text); }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="tpl-toolbar">
    <div id="bar">
      <div id="grip" :title="$t('tb.drag')" @mousedown.prevent="startDrag"><span v-html="gripIcon"></span></div>
      <div class="row" id="rowMain">
        <button
          v-for="tool in tools" :key="tool.id"
          class="tool" :class="{ active: activeTool === tool.id }"
          :title="$t(tool.key)" @click="toggleTool(tool.id)"
        ><span class="ico" v-html="tool.icon"></span></button>
        <div class="sep"></div>
        <button class="tool" :title="$t('tb.undo')" @click="act({ type: 'undo' })"><span class="ico" v-html="icons.undo"></span></button>
        <button class="tool" :title="$t('tb.redo')" @click="act({ type: 'redo' })"><span class="ico" v-html="icons.redo"></span></button>
        <button class="tool" :title="$t('tb.clear')" @click="act({ type: 'clear' })"><span class="ico" v-html="icons.clear"></span></button>
        <div class="sep"></div>
        <button class="tool exit" :title="$t('tb.exitTitle')" @click="act({ type: 'exit' })"><span class="ico">✕</span></button>
        <button class="tool" :title="$t('tb.downloadTitle')" @click="act({ type: 'download' })"><span class="ico" v-html="icons.save"></span></button>
        <button class="tool primary" :title="$t('tb.doneTitle')" @click="act({ type: 'done' })"><span class="ico">✔</span></button>
      </div>

      <div class="row" id="styleRow" v-show="activeTool">
        <div class="pgroup">
          <span
            v-for="c in colors" :key="c" class="swatch"
            :class="{ active: c === currentStyle.color }" :style="{ background: c }"
            :title="$t('tb.color')" @click="pickColor(c)"
          ></span>
        </div>
        <div class="sep"></div>
        <!-- 文字工具用字号下拉，其余工具用线宽点 -->
        <div class="pgroup" v-if="activeTool === 'text'">
          <span class="hint">{{ $t('tb.fontSize') }}</span>
          <select class="size-select" :title="$t('tb.fontSize')" :value="currentStyle.size" @change="pickSize(Number($event.target.value))">
            <option v-for="s in textSizes" :key="s" :value="s">{{ s }}</option>
          </select>
        </div>
        <div class="pgroup" v-else>
          <span
            v-for="w in widths" :key="w" class="wdot"
            :class="{ active: w === currentStyle.width }"
            :style="{ width: (4 + w * 2) + 'px', height: (4 + w * 2) + 'px' }"
            :title="$t('tb.width')" @click="pickWidth(w)"
          ></span>
        </div>
      </div>

      <div class="row" id="rowAgents" style="margin-top:6px">
        <button
          v-for="a in agents" :key="a.id"
          class="agent" :class="{ default: autoAnalyze && a.id === defaultAgentId }"
          :title="agentTitle(a)" @click="act({ type: 'agent', agentId: a.id })"
        ><span class="ico">{{ a.icon || '🤖' }}</span><span>{{ a.name }}</span></button>
        <span v-if="!agents.length" class="hint">{{ $t('tb.noAgents') }}</span>
        <span v-else-if="autoAnalyze" class="hint">{{ $t('tb.autoHint') }}</span>
      </div>
    </div>
  </script>

  <script src="../../../node_modules/vue/dist/vue.min.js"></script>
  <script src="../shared/vue-i18n.js"></script>
  <script src="toolbar-app.js"></script>
  <script src="toolbar.js"></script>
</body>
</html>
