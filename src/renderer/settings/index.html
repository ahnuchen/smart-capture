<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>设置 · 智能截图</title>
  <style>
    :root {
      --bg: #15171f;
      --panel: #1d2029;
      --panel2: #22252f;
      --border: rgba(120, 130, 160, 0.25);
      --text: #dbe2f0;
      --muted: #8b93a7;
      --accent: #60a5fa;
      --accent-bg: rgba(96, 165, 250, 0.14);
      --danger: #f87171;
      --ok: #34d399;
      --hover: rgba(255, 255, 255, 0.10);
      --scroll-thumb: #333949;
      --scroll-thumb-hover: #454d63;
      --savebar-bg: rgba(21, 23, 31, 0.97);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6fa;
        --panel: #ffffff;
        --panel2: #eef0f5;
        --border: rgba(60, 70, 100, 0.18);
        --text: #1f2430;
        --muted: #6b7280;
        --accent: #2f6fe0;
        --accent-bg: rgba(47, 111, 224, 0.10);
        --hover: rgba(0, 0, 0, 0.06);
        --scroll-thumb: #c3c8d4;
        --scroll-thumb-hover: #a9b0bf;
        --savebar-bg: rgba(255, 255, 255, 0.97);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    /* 全局滚动条 */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb); border-radius: 6px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-hover); }
    ::-webkit-scrollbar-corner { background: transparent; }
    /* 自定义标题栏 */
    #titlebar {
      height: 40px; flex: none;
      display: flex; align-items: center; gap: 9px;
      padding-left: 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }
    #titlebar img { width: 18px; height: 18px; }
    #titlebar .t-title { font-weight: 600; font-size: 13px; }
    .win-ops { display: flex; margin-left: auto; -webkit-app-region: no-drag; }
    .win-ops button {
      width: 40px; height: 40px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--muted);
      font-size: 13px; border-radius: 0;
    }
    .win-ops button:hover { background: var(--hover); color: var(--text); }
    .win-ops button.close:hover { background: #e81123; color: #fff; }
    #layout { display: flex; flex: 1; overflow: hidden; }
    nav {
      width: 190px; padding: 14px 12px; border-right: 1px solid var(--border);
      background: var(--panel); display: flex; flex-direction: column; gap: 4px;
    }
    nav .nav-pad { height: 4px; }
    nav a {
      padding: 9px 12px; border-radius: 8px; color: var(--muted); cursor: pointer;
      text-decoration: none; display: block;
    }
    nav a:hover { background: rgba(255,255,255,.05); color: var(--text); }
    nav a.active { background: var(--accent-bg); color: #bfdbfe; }
    main { flex: 1; overflow-y: auto; padding: 22px 26px 90px; }
    h2 { font-size: 17px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
    section.page { display: none; }
    section.page.active { display: block; }

    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
    }
    .card h3 { font-size: 14.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 11px; padding: 2px 8px; border-radius: 20px;
      background: rgba(52, 211, 153, .15); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, .35);
    }
    .badge.builtin { background: rgba(96, 165, 250, .15); color: #93c5fd; border-color: rgba(96,165,250,.35); }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
    input[type=text], input[type=password], textarea, select {
      width: 100%; font: inherit; color: var(--text);
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 11px; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 70px; font-family: inherit; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      font: inherit; color: var(--text); cursor: pointer;
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px; transition: all .12s;
    }
    button:hover { border-color: var(--accent); background: var(--accent-bg); }
    button.primary { background: #2f6fe0; border-color: #3b82f6; color: #fff; }
    button.primary:hover { background: #3b82f6; }
    button.danger { color: var(--danger); }
    button.danger:hover { border-color: var(--danger); background: rgba(248,113,113,.1); }
    button.small { padding: 5px 10px; font-size: 12.5px; }

    .model-item, .agent-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px;
      margin-bottom: 8px; background: var(--panel2);
    }
    .model-item input, .agent-item input[type=checkbox], .agent-item input[type=radio] { accent-color: var(--accent); }
    .model-item { cursor: pointer; }
    .model-item button { cursor: pointer; }
    .model-item input[type=radio] { pointer-events: none; }
    .model-item .grow, .agent-item .grow { flex: 1; min-width: 0; }
    .model-item .mid { color: var(--muted); font-size: 12px; }
    .model-item.active { border-color: var(--accent); background: var(--accent-bg); }
    .tag { font-size: 10.5px; padding: 1.5px 7px; border-radius: 12px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
    .tag.vision { color: #6ee7b7; border-color: rgba(52,211,153,.4); }
    .agent-item .ico { font-size: 20px; }
    .agent-item .name { font-weight: 600; }
    .agent-item .prompt-preview {
      color: var(--muted); font-size: 12px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 460px;
    }
    .agent-item .ops { display: flex; gap: 6px; align-items: center; }

    label.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
    label.switch input { width: 34px; height: 18px; accent-color: var(--accent); cursor: pointer; }

    #savebar {
      position: fixed; left: 190px; right: 0; bottom: 0;
      background: var(--savebar-bg); border-top: 1px solid var(--border);
      padding: 12px 26px; display: flex; align-items: center; gap: 14px; z-index: 10;
    }
    #saveTip { color: var(--ok); font-size: 13px; opacity: 0; transition: opacity .25s; }
    #saveTip.show { opacity: 1; }
    .spacer { flex: 1; }
    .kbd {
      background: var(--panel2); border: 1px solid var(--border); border-bottom-width: 2px;
      border-radius: 6px; padding: 2px 8px; font: 12px Consolas, monospace;
    }
    .grid-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
    .note { font-size: 12.5px; color: var(--muted); }
    .link { color: var(--accent); font-size: 13px; cursor: pointer; text-decoration: none; }
    .link:hover { text-decoration: underline; }
    .test-result { font-size: 12px; }
    .test-result.ok { color: var(--ok); }
    .test-result.fail { color: var(--danger); }
    /* 页内弹窗：替代原生 alert/confirm（原生模态在无边框窗口关闭后会丢焦点，导致页面无法继续输入） */
    #dialogBox {
      position: fixed; inset: 0; z-index: 100; display: flex;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.45);
    }
    #dialogBox[hidden] { display: none; }
    .dlg {
      width: 380px; max-width: calc(100vw - 48px);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }
    .dlg-msg { font-size: 13.5px; line-height: 1.6; margin-bottom: 16px; white-space: pre-line; }
    .dlg-ops { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <div id="titlebar">
    <img src="../../../assets/icon.png" alt="" />
    <span class="t-title" data-i18n="set.titlebar"></span>
    <div class="win-ops">
      <button id="winMin" data-i18n-title="win.minimize">—</button>
      <button id="winMax" data-i18n-title="win.maximize">▢</button>
      <button id="winClose" class="close" data-i18n-title="win.close">✕</button>
    </div>
  </div>
  <div id="layout">
    <nav>
      <div class="nav-pad"></div>
      <a data-page="providers" class="active" data-i18n="nav.providers"></a>
      <a data-page="agents" data-i18n="nav.agents"></a>
      <a data-page="capture" data-i18n="nav.capture"></a>
      <a data-page="general" data-i18n="nav.general"></a>
    </nav>
    <main>
      <!-- 模型服务 -->
      <section class="page active" id="page-providers">
        <h2 data-i18n="pv.title"></h2>
        <div class="sub" data-i18n="pv.sub"></div>
        <div class="card">
          <h3 data-i18n="pv.current"></h3>
          <div id="providerList"></div>
          <div class="grid-actions">
            <button id="btnAddProvider" class="small" data-i18n="pv.add"></button>
          </div>
        </div>
        <div class="card" id="providerEditor" style="display:none">
          <h3 id="peTitle" data-i18n="pv.editTitle"></h3>
          <div class="field"><label data-i18n="pv.name"></label><input type="text" id="peName" data-i18n-ph="pv.namePh" /></div>
          <div class="field"><label data-i18n="pv.base"></label><input type="text" id="peBase" data-i18n-ph="pv.basePh" /></div>
          <div class="field"><label data-i18n="pv.key"></label><input type="password" id="peKey" data-i18n-ph="pv.keyPh" /></div>
          <div class="field">
            <label data-i18n="pv.models"></label>
            <textarea id="peModels" rows="4" data-i18n-ph="pv.modelsPh"></textarea>
          </div>
          <div class="grid-actions">
            <button id="peSave" class="primary small" data-i18n="pv.save"></button>
            <button id="peCancel" class="small" data-i18n="pv.cancel"></button>
            <button id="peDelete" class="danger small" style="display:none" data-i18n="pv.delete"></button>
          </div>
        </div>
        <div class="card">
          <h3><span data-i18n="pv.selectModel"></span> <span class="badge" id="activeProviderBadge"></span></h3>
          <div id="modelList"></div>
          <div class="grid-actions">
            <button id="btnResetModels" class="small" style="display:none" data-i18n="pv.resetModels"></button>
          </div>
          <div class="note" style="margin-top:6px" data-i18n="pv.modelNote"></div>
        </div>
        <div class="card" id="modelEditor" style="display:none">
          <h3 data-i18n="pv.meTitle"></h3>
          <div class="field"><label data-i18n="pv.meId"></label><input type="text" id="meId" data-i18n-ph="pv.meIdPh" /></div>
          <div class="field"><label data-i18n="pv.meName"></label><input type="text" id="meName" data-i18n-ph="pv.meNamePh" /></div>
          <div class="field">
            <label class="switch"><input type="checkbox" id="meVision" /> <span data-i18n="pv.meVision"></span></label>
          </div>
          <div class="grid-actions">
            <button id="meSave" class="primary small" data-i18n="pv.save"></button>
            <button id="meCancel" class="small" data-i18n="pv.cancel"></button>
          </div>
        </div>
        <div class="card" id="builtinKeyCard" style="display:none">
          <h3 data-i18n="pv.builtinKeyTitle"></h3>
          <div class="field"><label data-i18n="pv.builtinKeyLabel"></label><input type="password" id="builtinKey" /></div>
          <div class="grid-actions">
            <button id="builtinKeySave" class="primary small" data-i18n="pv.builtinKeySave"></button>
            <a id="fetchKeyLink" class="link" href="https://platform.aitools.cfd/key" target="_blank" rel="noopener" data-i18n="pv.fetchKey" data-i18n-title="pv.fetchKeyTitle"></a>
          </div>
        </div>
      </section>

      <!-- 智能体 -->
      <section class="page" id="page-agents">
        <h2 data-i18n="ag.title"></h2>
        <div class="sub" data-i18n="ag.sub"></div>
        <div class="card">
          <div id="agentList"></div>
          <div class="grid-actions">
            <button id="btnAddAgent" class="small" data-i18n="ag.add"></button>
            <button id="btnResetAgents" class="small" data-i18n="ag.reset"></button>
          </div>
        </div>
        <div class="card" id="agentEditor" style="display:none">
          <h3 id="aeTitle" data-i18n="ag.newTitle"></h3>
          <div class="row2">
            <div class="field"><label data-i18n="ag.icon"></label><input type="text" id="aeIcon" maxlength="4" data-i18n-ph="ag.iconPh" /></div>
            <div class="field"><label data-i18n="ag.name"></label><input type="text" id="aeName" data-i18n-ph="ag.namePh" /></div>
          </div>
          <div class="field">
            <label data-i18n="ag.prompt"></label>
            <textarea id="aePrompt" rows="8" data-i18n-ph="ag.promptPh"></textarea>
          </div>
          <div class="field">
            <label data-i18n="ag.model"></label>
            <select id="aeModel"></select>
          </div>
          <div class="grid-actions">
            <button id="aeSave" class="primary small" data-i18n="ag.save"></button>
            <button id="aeCancel" class="small" data-i18n="pv.cancel"></button>
            <button id="aeDelete" class="danger small" style="display:none" data-i18n="ag.del"></button>
          </div>
        </div>
      </section>

      <!-- 截图行为 -->
      <section class="page" id="page-capture">
        <h2 data-i18n="cap.title"></h2>
        <div class="sub" data-i18n="cap.sub"></div>
        <div class="card">
          <h3 data-i18n="cap.default"></h3>
          <div class="field">
            <label data-i18n="cap.defaultLabel"></label>
            <select id="defaultAgent"></select>
          </div>
          <div class="field">
            <label class="switch"><input type="checkbox" id="autoAnalyze" /> <span data-i18n="cap.autoAnalyze"></span></label>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="cap.shortcut"></h3>
          <div class="field">
            <label data-i18n="cap.current"></label>
            <div><span class="kbd" id="shortcutDisplay"></span></div>
          </div>
          <div class="field"><label data-i18n="cap.record"></label><button id="btnRecord" data-i18n="cap.record"></button></div>
          <div class="note" data-i18n="cap.recordNote"></div>
        </div>
      </section>

      <!-- 通用 -->
      <section class="page" id="page-general">
        <h2 data-i18n="gen.title"></h2>
        <div class="sub" data-i18n="gen.sub"></div>
        <div class="card">
          <h3 data-i18n="gen.theme"></h3>
          <div class="field">
            <label data-i18n="gen.themeLabel"></label>
            <select id="theme">
              <option value="system" data-i18n="theme.system"></option>
              <option value="dark" data-i18n="theme.dark"></option>
              <option value="light" data-i18n="theme.light"></option>
            </select>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="gen.language"></h3>
          <div class="field">
            <label data-i18n="gen.languageLabel"></label>
            <select id="language">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="gen.startup"></h3>
          <div class="field">
            <label class="switch"><input type="checkbox" id="openAtLogin" /> <span data-i18n="gen.openAtLogin"></span></label>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="gen.aboutTitle"></h3>
          <div class="note" id="aboutText"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="savebar">
    <span id="saveTip" data-i18n="savebar.saved"></span>
    <span class="spacer"></span>
    <span class="note" id="dirtyTip" style="display:none" data-i18n="savebar.dirty"></span>
    <button id="btnSaveAll" class="primary" data-i18n="savebar.save"></button>
  </div>

  <div id="dialogBox" hidden>
    <div class="dlg">
      <div class="dlg-msg" id="dlgMsg"></div>
      <div class="dlg-ops">
        <button id="dlgCancel" class="small"></button>
        <button id="dlgOk" class="primary small"></button>
      </div>
    </div>
  </div>

  <script src="../../shared/i18n-dom.js"></script>
  <script src="../../shared/agents.js"></script>
  <script>applyI18n();</script>
  <script src="settings.js"></script>
</body>
</html>
