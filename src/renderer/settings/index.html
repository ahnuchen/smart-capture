<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>设置 · 智能截图</title>
  <style>
    :root {
      --bg: #15171f;
      --panel: #1d2029;
      --panel2: #22252f;
      --border: rgba(120, 130, 160, 0.25);
      --text: #dbe2f0;
      --muted: #8b93a7;
      --accent: #60a5fa;
      --accent-bg: rgba(96, 165, 250, 0.14);
      --danger: #f87171;
      --ok: #34d399;
      --hover: rgba(255, 255, 255, 0.10);
      --scroll-thumb: #333949;
      --scroll-thumb-hover: #454d63;
      --savebar-bg: rgba(21, 23, 31, 0.97);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6fa;
        --panel: #ffffff;
        --panel2: #eef0f5;
        --border: rgba(60, 70, 100, 0.18);
        --text: #1f2430;
        --muted: #6b7280;
        --accent: #2f6fe0;
        --accent-bg: rgba(47, 111, 224, 0.10);
        --hover: rgba(0, 0, 0, 0.06);
        --scroll-thumb: #c3c8d4;
        --scroll-thumb-hover: #a9b0bf;
        --savebar-bg: rgba(255, 255, 255, 0.97);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    /* 全局滚动条 */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb); border-radius: 6px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-hover); }
    ::-webkit-scrollbar-corner { background: transparent; }
    /* 自定义标题栏 */
    #titlebar {
      height: 40px; flex: none;
      display: flex; align-items: center; gap: 9px;
      padding-left: 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }
    #titlebar img { width: 18px; height: 18px; }
    #titlebar .t-title { font-weight: 600; font-size: 13px; }
    .win-ops { display: flex; margin-left: auto; -webkit-app-region: no-drag; }
    .win-ops button {
      width: 40px; height: 40px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--muted);
      font-size: 13px; border-radius: 0;
    }
    .win-ops button:hover { background: var(--hover); color: var(--text); }
    .win-ops button.close:hover { background: #e81123; color: #fff; }
    #layout { display: flex; flex: 1; overflow: hidden; }
    /* Vue 挂载后的根节点：必须撑满 body 的纵向 flex，否则 #layout 的 flex:1 失效、main 不能滚动 */
    #settings-root { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    nav {
      width: 190px; padding: 14px 12px; border-right: 1px solid var(--border);
      background: var(--panel); display: flex; flex-direction: column; gap: 4px;
    }
    nav .nav-pad { height: 4px; }
    nav a {
      padding: 9px 12px; border-radius: 8px; color: var(--muted); cursor: pointer;
      text-decoration: none; display: block;
    }
    nav a:hover { background: rgba(255,255,255,.05); color: var(--text); }
    nav a.active { background: var(--accent-bg); color: #bfdbfe; }
    main { flex: 1; overflow-y: auto; padding: 22px 26px 90px; }
    h2 { font-size: 17px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
    section.page { display: none; }
    section.page.active { display: block; }

    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
    }
    .card h3 { font-size: 14.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 11px; padding: 2px 8px; border-radius: 20px;
      background: rgba(52, 211, 153, .15); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, .35);
    }
    .badge.builtin { background: rgba(96, 165, 250, .15); color: #93c5fd; border-color: rgba(96,165,250,.35); }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
    input[type=text], input[type=password], textarea, select {
      width: 100%; font: inherit; color: var(--text);
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 11px; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 70px; font-family: inherit; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      font: inherit; color: var(--text); cursor: pointer;
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px; transition: all .12s;
    }
    button:hover { border-color: var(--accent); background: var(--accent-bg); }
    button.primary { background: #2f6fe0; border-color: #3b82f6; color: #fff; }
    button.primary:hover { background: #3b82f6; }
    button.danger { color: var(--danger); }
    button.danger:hover { border-color: var(--danger); background: rgba(248,113,113,.1); }
    button.small { padding: 5px 10px; font-size: 12.5px; }

    .model-item, .agent-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px;
      margin-bottom: 8px; background: var(--panel2);
    }
    .model-item input, .agent-item input[type=checkbox], .agent-item input[type=radio] { accent-color: var(--accent); }
    .model-item { cursor: pointer; }
    .model-item button { cursor: pointer; }
    .model-item input[type=radio] { pointer-events: none; }
    .model-item .grow, .agent-item .grow { flex: 1; min-width: 0; }
    .model-item .mid { color: var(--muted); font-size: 12px; }
    .model-item.active { border-color: var(--accent); background: var(--accent-bg); }
    .tag { font-size: 10.5px; padding: 1.5px 7px; border-radius: 12px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
    .tag.vision { color: #6ee7b7; border-color: rgba(52,211,153,.4); }
    .tag.thinking { color: #fcd34d; border-color: rgba(251,191,36,.4); }
    .agent-item .ico { font-size: 20px; }
    .agent-item .name { font-weight: 600; }
    .agent-item .prompt-preview {
      color: var(--muted); font-size: 12px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 460px;
    }
    .agent-item .ops { display: flex; gap: 6px; align-items: center; }

    label.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
    label.switch input { width: 34px; height: 18px; accent-color: var(--accent); cursor: pointer; }

    #savebar {
      position: fixed; left: 190px; right: 0; bottom: 0;
      background: var(--savebar-bg); border-top: 1px solid var(--border);
      padding: 12px 26px; display: flex; align-items: center; gap: 14px; z-index: 10;
    }
    #saveTip { color: var(--ok); font-size: 13px; opacity: 0; transition: opacity .25s; }
    #saveTip.show { opacity: 1; }
    .spacer { flex: 1; }
    .kbd {
      background: var(--panel2); border: 1px solid var(--border); border-bottom-width: 2px;
      border-radius: 6px; padding: 2px 8px; font: 12px Consolas, monospace;
    }
    .grid-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
    .note { font-size: 12.5px; color: var(--muted); }
    .link { color: var(--accent); font-size: 13px; cursor: pointer; text-decoration: none; }
    .link:hover { text-decoration: underline; }
    .test-result { font-size: 12px; }
    .test-result.ok { color: var(--ok); }
    .test-result.fail { color: var(--danger); }
    /* 页内弹窗：替代原生 alert/confirm（原生模态在无边框窗口关闭后会丢焦点，导致页面无法继续输入） */
    #dialogBox {
      position: fixed; inset: 0; z-index: 100; display: flex;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.45);
    }
    #dialogBox[hidden] { display: none; }
    .dlg {
      width: 380px; max-width: calc(100vw - 48px);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }
    .dlg-msg { font-size: 13.5px; line-height: 1.6; margin-bottom: 16px; white-space: pre-line; }
    .dlg-ops { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="tpl-settings">
    <div id="settings-root">
      <div id="titlebar">
        <img src="../../../assets/icon.png" alt="" />
        <span class="t-title">{{ $t('set.titlebar') }}</span>
        <div class="win-ops">
          <button id="winMin" :title="$t('win.minimize')" @click="winOp('minimize')">—</button>
          <button id="winMax" :title="$t('win.maximize')" @click="winOp('maximize')">▢</button>
          <button id="winClose" class="close" :title="$t('win.close')" @click="winOp('close')">✕</button>
        </div>
      </div>

      <div id="layout" v-if="loaded">
        <nav>
          <div class="nav-pad"></div>
          <a v-for="pg in ['providers', 'agents', 'capture', 'general']" :key="pg" :data-page="pg" :class="{ active: page === pg }" @click="page = pg">{{ $t('nav.' + pg) }}</a>
        </nav>
        <main>
          <!-- 模型服务 -->
          <section class="page" id="page-providers" :class="{ active: page === 'providers' }">
            <h2>{{ $t('pv.title') }}</h2>
            <div class="sub">{{ $t('pv.sub') }}</div>
            <div class="card">
              <h3>{{ $t('pv.current') }}</h3>
              <div id="providerList">
                <div
                  v-for="p in providers" :key="p.id" class="model-item"
                  :class="{ active: settings.activeProviderId === p.id }" @click="selectProvider(p)"
                >
                  <input type="radio" name="provider" :checked="settings.activeProviderId === p.id" />
                  <span class="grow">
                    <div>{{ p.name }} <span v-if="p.builtIn" class="badge builtin">{{ $t('pv.builtin') }}</span></div>
                    <div class="mid">{{ p.baseURL }}</div>
                  </span>
                  <span class="tag">{{ $t('pv.modelCount', (p.models || []).length) }}</span>
                  <template v-if="!p.builtIn">
                    <button class="small" @click.stop="openProviderEditor(p)">{{ $t('pv.editModel') }}</button>
                    <button class="small danger" @click.stop="deleteProvider(p.id)">{{ $t('pv.delModel') }}</button>
                  </template>
                </div>
              </div>
              <div class="grid-actions">
                <button id="btnAddProvider" class="small" @click="addProvider">{{ $t('pv.add') }}</button>
              </div>
            </div>

            <div class="card" id="providerEditor" v-show="providerEditor.open" ref="providerEditorCard">
              <h3>{{ settings.providers[providerEditor.id] ? $t('pv.editTitle') : $t('pv.addTitle') }}</h3>
              <div class="field"><label>{{ $t('pv.name') }}</label><input type="text" id="peName" ref="peName" v-model="providerEditor.name" :placeholder="$t('pv.namePh')" /></div>
              <div class="field"><label>{{ $t('pv.base') }}</label><input type="text" id="peBase" v-model="providerEditor.base" :placeholder="$t('pv.basePh')" /></div>
              <div class="field"><label>{{ $t('pv.key') }}</label><input type="password" id="peKey" v-model="providerEditor.key" :placeholder="$t('pv.keyPh')" /></div>
              <div class="field">
                <label>{{ $t('pv.models') }}</label>
                <textarea id="peModels" rows="4" v-model="providerEditor.models" :placeholder="$t('pv.modelsPh')"></textarea>
              </div>
              <div class="grid-actions">
                <button id="peSave" class="primary small" @click="saveProvider">{{ $t('pv.save') }}</button>
                <button id="peCancel" class="small" @click="providerEditor.open = false">{{ $t('pv.cancel') }}</button>
                <button id="peDelete" class="danger small" v-show="!!settings.providers[providerEditor.id]" @click="deleteProvider(providerEditor.id)">{{ $t('pv.delete') }}</button>
              </div>
            </div>

            <div class="card">
              <h3>{{ $t('pv.selectModel') }} <span class="badge" id="activeProviderBadge">{{ activeProvider ? activeProvider.name : '' }}</span></h3>
              <div id="modelList">
                <div
                  v-for="m in models" :key="m.id" class="model-item"
                  :class="{ active: settings.activeModelId === m.id }" @click="selectModel(m)"
                >
                  <input type="radio" name="model" :checked="settings.activeModelId === m.id" />
                  <span class="grow"><div>{{ m.name || m.id }}</div><div class="mid">{{ m.id }}</div></span>
                  <span class="test-result" :class="testResult(m.id).state">{{ testResult(m.id).text }}</span>
                  <span v-if="m.vision" class="tag vision">{{ $t('pv.vision') }}</span>
                  <span v-else class="tag">{{ $t('pv.text') }}</span>
                  <span v-if="m.thinking" class="tag thinking">{{ $t('pv.thinking') }}</span>
                  <button class="small" :disabled="testResult(m.id).state === 'testing'" @click.stop="testModel(m, activeProvider)">{{ $t('pv.test') }}</button>
                  <button class="small" @click.stop="openModelEditor(m)">{{ $t('pv.editModel') }}</button>
                  <button v-if="models.length > 1" class="small danger" @click.stop="deleteModel(m)">{{ $t('pv.delModel') }}</button>
                </div>
              </div>
              <div class="grid-actions">
                <button id="btnResetModels" class="small" v-show="activeProvider && activeProvider.builtIn" @click="resetBuiltinModels">{{ $t('pv.resetModels') }}</button>
              </div>
              <div class="note" style="margin-top:6px">{{ $t('pv.modelNote') }}</div>
            </div>

            <div class="card" id="modelEditor" v-show="modelEditor.open">
              <h3>{{ $t('pv.meTitle') }}</h3>
              <div class="field"><label>{{ $t('pv.meId') }}</label><input type="text" id="meId" ref="meId" v-model="modelEditor.id" :placeholder="$t('pv.meIdPh')" /></div>
              <div class="field"><label>{{ $t('pv.meName') }}</label><input type="text" id="meName" v-model="modelEditor.name" :placeholder="$t('pv.meNamePh')" /></div>
              <div class="field">
                <label class="switch"><input type="checkbox" id="meVision" v-model="modelEditor.vision" /> <span>{{ $t('pv.meVision') }}</span></label>
              </div>
              <div class="field">
                <label class="switch"><input type="checkbox" id="meThinking" v-model="modelEditor.thinking" /> <span>{{ $t('pv.meThinking') }}</span></label>
              </div>
              <div class="grid-actions">
                <button id="meSave" class="primary small" @click="saveModelEditor">{{ $t('pv.save') }}</button>
                <button id="meCancel" class="small" @click="modelEditor.open = false">{{ $t('pv.cancel') }}</button>
              </div>
            </div>

            <div class="card" id="builtinKeyCard" v-show="activeProvider && activeProvider.builtIn">
              <h3>{{ $t('pv.builtinKeyTitle') }}</h3>
              <div class="field"><label>{{ $t('pv.builtinKeyLabel') }}</label><input type="password" id="builtinKey" v-model="builtinKey" /></div>
              <div class="grid-actions">
                <button id="builtinKeySave" class="primary small" @click="saveBuiltinKey">{{ $t('pv.builtinKeySave') }}</button>
                <a id="fetchKeyLink" class="link" href="https://platform.aitools.cfd/key" target="_blank" rel="noopener" :title="$t('pv.fetchKeyTitle')">{{ $t('pv.fetchKey') }}</a>
              </div>
            </div>
          </section>

          <!-- 智能体 -->
          <section class="page" id="page-agents" :class="{ active: page === 'agents' }">
            <h2>{{ $t('ag.title') }}</h2>
            <div class="sub">{{ $t('ag.sub') }}</div>
            <div class="card">
              <div id="agentList">
                <div v-for="a in settings.agents" :key="a.id" class="agent-item">
                  <span class="ico">{{ a.icon || '🤖' }}</span>
                  <span class="grow">
                    <div class="name">{{ agentDisplayName(a) }} <span v-if="a.id === settings.defaultAgentId" class="badge">{{ $t('ag.default') }}</span> <span v-if="a.builtIn" class="badge builtin">{{ $t('ag.builtin') }}</span></div>
                    <div class="prompt-preview">{{ agentDisplayPrompt(a).replace(/\n/g, ' ').slice(0, 80) }}</div>
                  </span>
                  <span class="ops">
                    <label class="switch" :title="$t('ag.enabled')"><input type="checkbox" :checked="a.enabled !== false" @change="toggleAgent(a, $event.target.checked)" /></label>
                    <button class="small" :title="$t('ag.setDefault')" @click="setDefaultAgent(a)">{{ $t('ag.setDefault') }}</button>
                    <button class="small" @click="openAgentEditor(a)">{{ $t('ag.edit') }}</button>
                    <button v-if="!a.builtIn" class="small danger" @click="deleteAgent(a)">{{ $t('ag.del') }}</button>
                  </span>
                </div>
              </div>
              <div class="grid-actions">
                <button id="btnAddAgent" class="small" @click="openAgentEditor(null)">{{ $t('ag.add') }}</button>
                <button id="btnResetAgents" class="small" @click="resetAgents">{{ $t('ag.reset') }}</button>
              </div>
            </div>

            <div class="card" id="agentEditor" v-show="agentEditor.open" ref="agentEditorCard">
              <h3>{{ agentEditor.id ? $t('ag.editTitle', agentEditor.name || agentEditor.icon) : $t('ag.newTitle') }}</h3>
              <div class="row2">
                <div class="field"><label>{{ $t('ag.icon') }}</label><input type="text" id="aeIcon" maxlength="4" v-model="agentEditor.icon" :placeholder="$t('ag.iconPh')" /></div>
                <div class="field"><label>{{ $t('ag.name') }}</label><input type="text" id="aeName" ref="aeName" v-model="agentEditor.name" :placeholder="$t('ag.namePh')" /></div>
              </div>
              <div class="field">
                <label>{{ $t('ag.prompt') }}</label>
                <textarea id="aePrompt" rows="8" v-model="agentEditor.prompt" :placeholder="$t('ag.promptPh')"></textarea>
              </div>
              <div class="field">
                <label>{{ $t('ag.model') }}</label>
                <select id="aeModel" v-model="agentEditor.model">
                  <option value="">{{ $t('ag.followGlobal') }}</option>
                  <option v-for="m in models" :key="m.id" :value="m.id">{{ (m.name || m.id) + (m.vision ? ' 👁' : '') }}</option>
                </select>
              </div>
              <div class="grid-actions">
                <button id="aeSave" class="primary small" @click="saveAgent">{{ $t('ag.save') }}</button>
                <button id="aeCancel" class="small" @click="agentEditor.open = false">{{ $t('pv.cancel') }}</button>
                <button id="aeDelete" v-show="agentEditor.open && agentEditor.id" class="danger small" @click="deleteEditingAgent">{{ $t('ag.del') }}</button>
              </div>
            </div>
          </section>

          <!-- 截图行为 -->
          <section class="page" id="page-capture" :class="{ active: page === 'capture' }">
            <h2>{{ $t('cap.title') }}</h2>
            <div class="sub">{{ $t('cap.sub') }}</div>
            <div class="card">
              <h3>{{ $t('cap.default') }}</h3>
              <div class="field">
                <label>{{ $t('cap.defaultLabel') }}</label>
                <select id="defaultAgent" v-model="settings.defaultAgentId" @change="markDirty">
                  <option v-for="a in settings.agents" :key="a.id" :value="a.id">{{ agentLabel(a) }}</option>
                </select>
              </div>
              <div class="field">
                <label class="switch"><input type="checkbox" id="autoAnalyze" v-model="settings.autoAnalyze" @change="markDirty" /> <span>{{ $t('cap.autoAnalyze') }}</span></label>
              </div>
            </div>
            <div class="card">
              <h3>{{ $t('cap.shortcut') }}</h3>
              <div class="field">
                <label>{{ $t('cap.current') }}</label>
                <div><span class="kbd" id="shortcutDisplay">{{ shortcutDisplay }}</span></div>
              </div>
              <div class="field"><label>{{ $t('cap.record') }}</label><button id="btnRecord" @click="recording = true">{{ recording ? $t('cap.recording') : $t('cap.record') }}</button></div>
              <div class="note">{{ $t('cap.recordNote') }}</div>
            </div>
          </section>

          <!-- 通用 -->
          <section class="page" id="page-general" :class="{ active: page === 'general' }">
            <h2>{{ $t('gen.title') }}</h2>
            <div class="sub">{{ $t('gen.sub') }}</div>
            <div class="card">
              <h3>{{ $t('gen.theme') }}</h3>
              <div class="field">
                <label>{{ $t('gen.themeLabel') }}</label>
                <select id="theme" v-model="settings.theme" @change="markDirty">
                  <option value="system">{{ $t('theme.system') }}</option>
                  <option value="dark">{{ $t('theme.dark') }}</option>
                  <option value="light">{{ $t('theme.light') }}</option>
                </select>
              </div>
            </div>
            <div class="card">
              <h3>{{ $t('gen.language') }}</h3>
              <div class="field">
                <label>{{ $t('gen.languageLabel') }}</label>
                <select id="language" v-model="settings.language" @change="markDirty">
                  <option value="zh">中文</option>
                  <option value="en">English</option>
                </select>
              </div>
            </div>
            <div class="card">
              <h3>{{ $t('gen.startup') }}</h3>
              <div class="field">
                <label class="switch"><input type="checkbox" id="openAtLogin" v-model="settings.openAtLogin" @change="markDirty" /> <span>{{ $t('gen.openAtLogin') }}</span></label>
              </div>
            </div>
            <div class="card">
              <h3>{{ $t('gen.aboutTitle') }}</h3>
              <div class="note" id="aboutText">{{ $t('gen.about', '1.0.0') }}</div>
            </div>
          </section>
        </main>
      </div>

      <div id="savebar" v-if="loaded">
        <span id="saveTip" :class="{ show: savedFlash }">{{ $t('savebar.saved') }}</span>
        <span class="spacer"></span>
        <span class="note" id="dirtyTip" v-show="dirty">{{ $t('savebar.dirty') }}</span>
        <button id="btnSaveAll" class="primary" @click="saveNow">{{ $t('savebar.save') }}</button>
      </div>

      <div id="dialogBox" :hidden="!dialog.open" @keydown="onDialogKeydown" @mousedown="onDialogBackdrop">
        <div class="dlg">
          <div class="dlg-msg" id="dlgMsg">{{ dialog.message }}</div>
          <div class="dlg-ops">
            <button id="dlgCancel" class="small" v-show="dialog.danger" @click="dialogDone(false)">{{ $t('pv.cancel') }}</button>
            <button id="dlgOk" ref="dlgOk" class="primary small" @click="dialogDone(true)">{{ $t(dialog.danger ? 'ag.del' : 'dlg.ok') }}</button>
          </div>
        </div>
      </div>
    </div>
  </script>
