<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>钉图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #101218; cursor: move; }
    /* 边框画在图片自身上（画在 body 上会被图片盖住），默认一圈浅蓝，悬浮加亮 */
    #img {
      width: 100%; height: 100%; display: block; -webkit-user-drag: none;
      border: 2px solid rgba(96, 165, 250, 0.55);
      transition: border-color .12s;
    }
    body:hover #img { border-color: rgba(96, 165, 250, 1); }
    #close {
      position: absolute; top: 6px; right: 6px;
      width: 24px; height: 24px; border: none; border-radius: 6px;
      background: rgba(21, 23, 31, 0.86); color: #dbe2f0;
      font: 13px/1 "Segoe UI", sans-serif; cursor: pointer;
      opacity: 0.5; transition: opacity .12s, background .12s;
    }
    body:hover #close { opacity: 1; }
    #close:hover { background: #d9534f; color: #fff; }
  </style>
</head>
<body>
  <img id="img" alt="" />
  <button id="close" title="关闭">✕</button>
  <script src="pin.js"></script>
</body>
</html>
